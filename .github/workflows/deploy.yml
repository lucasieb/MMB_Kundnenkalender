name: Deploy via SFTP to Hostinger
on:
  push:
    branches: [main]
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: hostinger-production
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_sqlite
          coverage: none
      - name: Validate release before upload
        run: |
          find . -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l
          php tests/contract.php
          php tests/orders.php
          node --test tests/*.test.mjs
      - name: Prepare runtime files and revision marker
        run: |
          php -r 'file_put_contents("deployment.json", json_encode(["commit" => getenv("GITHUB_SHA"), "branch" => getenv("GITHUB_REF_NAME"), "run_id" => getenv("GITHUB_RUN_ID")], JSON_PRETTY_PRINT) . PHP_EOL);'
          cp .github/hostinger_known_hosts "$RUNNER_TEMP/mmb-known-hosts"
          rm -rf .git .github tests node_modules
          rm -f .env.dist .env .env.local admin_users.php admin_users.example.php mail.private.php php-error.log DEPLOYMENT.md .gitignore
          find . -name '*.map' -type f -delete
          find . -name '.DS_Store' -type f -delete
      - name: Deploy to verified Hostinger server and migrate additive fields
        env:
          MMB_DEPLOY_SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          MMB_DEPLOY_USER: ${{ secrets.USER }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s\n' "$MMB_DEPLOY_SSH_KEY" > "$RUNNER_TEMP/mmb-deploy-key"
          trap 'rm -f "$RUNNER_TEMP/mmb-deploy-key" "$RUNNER_TEMP/mmb-sftp.batch"' EXIT
          printf '%s\n' 'put -r lib domains/firebrick-squirrel-568721.hostingersite.com/public_html/' 'put -r . domains/firebrick-squirrel-568721.hostingersite.com/public_html/' > "$RUNNER_TEMP/mmb-sftp.batch"
          sftp -oBatchMode=yes -oAddressFamily=inet -oConnectTimeout=25 -oConnectionAttempts=2 -oStrictHostKeyChecking=yes -oUserKnownHostsFile="$RUNNER_TEMP/mmb-known-hosts" -P 65002 -i "$RUNNER_TEMP/mmb-deploy-key" -b "$RUNNER_TEMP/mmb-sftp.batch" "$MMB_DEPLOY_USER@srv2024.hstgr.io"
          ssh -oBatchMode=yes -oAddressFamily=inet -oConnectTimeout=25 -oStrictHostKeyChecking=yes -oUserKnownHostsFile="$RUNNER_TEMP/mmb-known-hosts" -p 65002 -i "$RUNNER_TEMP/mmb-deploy-key" "$MMB_DEPLOY_USER@srv2024.hstgr.io" 'cd domains/firebrick-squirrel-568721.hostingersite.com/public_html && php migrate_booking_fields.php && php migrate_order_fields.php'
      - name: Verify published revision and database health
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          curl --fail --silent --show-error --retry 3 "https://firebrick-squirrel-568721.hostingersite.com/deployment.json?revision=$EXPECTED_COMMIT" -o /tmp/mmb-deployment.json
          php -r '$data = json_decode(file_get_contents("/tmp/mmb-deployment.json"), true); if (($data["commit"] ?? "") !== getenv("EXPECTED_COMMIT")) { fwrite(STDERR, "Published revision mismatch\n"); exit(1); }'
          curl --fail --silent --show-error --retry 3 'https://firebrick-squirrel-568721.hostingersite.com/ping.php' -o /tmp/mmb-ping.json
          php -r '$data = json_decode(file_get_contents("/tmp/mmb-ping.json"), true); if (($data["ok"] ?? false) !== true) { fwrite(STDERR, "Database health check failed\n"); exit(1); }'
