name: Check booking contracts
on:
  pull_request:
    branches: [main]
  push:
    branches: ["fix/align-main-with-live"]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_sqlite
          coverage: none
      - name: PHP syntax
        run: find . -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l
      - name: Booking and admin contracts
        run: |
          php tests/contract.php
          php tests/orders.php
          php tests/communication.php
      - name: Shared embedded admin login
        run: node --test tests/*.test.mjs
